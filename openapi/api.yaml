openapi: 3.0.3

info:
  title: Bookclub API
  description: REST API for the Bookclub application
  version: 1.0.0
  contact:
    name: Martin Gallauner
    email: martin.gallauner@pmme

servers:
  - url: http://localhost:8080
    description: Local development server
#    - url: https://api.bookclub.example.com
#      description: Development environment server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ UP, DOWN ]
          example: UP
        timestamp:
          type: string
          format: date-time
          example: '2025-02-24T10:30:00Z'

