server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  flyway:
    enabled: true

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration-ms: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized