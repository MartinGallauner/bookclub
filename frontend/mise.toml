[tools]
dart = "latest"

[tasks.analyze]
description = "Runs flutters static code analyzer"
run = "flutter analyze"

[tasks.dependencies]
description = "Loads specified dependencies"
run = "flutter pub get"

[tasks.test]
description = "Run flutter tests"
depends = ['dependencies', 'analyze']
run = "flutter test"

[tasks.start]
description = "Starts the app locally for Chrome"
run = "flutter run -d web-server --web-port=8080"

[tasks.build]
description = "Builds the app for WEB"
depends = ['test']
run = "flutter build web"

[tasks.deploy]
description = "Deploys the WEB app"
depends = ['build']
run = 'firebase deploy --only hosting'